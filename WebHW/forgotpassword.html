<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link rel="stylesheet" href="forgotpasswordstyle.css">
</head>
<body>
<div class="forgot-password-container">
    <h2>Forgot Your Password?</h2>
    <p>No worries! Just enter your email address below and we'll help you reset your password.</p>

    <form action="http://localhost/webcourse/WebHW/forgotpassword/password-reset.php" method="POST">
        <div class="form-group">
            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>
        </div>
        <button type="submit" class="btn">Send Reset Link</button>
    </form>

    <p><a href="login.html">Back to Login</a></p>
</div>
</body>
</html>
